# NOT APPLIED FROM THIS FILE. The Claude credential Secret exists by name only in the repository.
# The operator creates it from a file that never passes through chat or a shell history:
#
#   kubectl -n goalbox-k3 create secret generic goalbox-claude-token --from-file=token=/path/to/token-file
#   shred -u /path/to/token-file
#
# Who can read it: in this namespace, only the operator's own identity (namespace-scoped RBAC; no Role
# here grants `secrets` to any ServiceAccount, and the shared `dc` account has no binding in goalbox-k3,
# see check_manifests.py). It is mounted into the agent container only (70-agent.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: goalbox-claude-token
  namespace: goalbox-k3
type: Opaque
# data: {token: <created by the operator; never committed>}

# C1 only: the allowlist proxy on a public python image with netproxy.py from a ConfigMap, because the
# project image cannot be pushed yet (registry login 401). Same Service, labels, SA, security context and
# NetworkPolicies as the production manifest 40-proxy.yaml; only the image and the code source differ.
apiVersion: v1
kind: Service
metadata: {name: goalbox-proxy, namespace: goalbox-k3}
spec:
  selector: {app.kubernetes.io/component: proxy}
  ports: [{name: proxy, port: 3128, targetPort: 3128}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goalbox-proxy
  namespace: goalbox-k3
  labels: {app.kubernetes.io/component: proxy}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/component: proxy}}
  template:
    metadata: {labels: {app.kubernetes.io/component: proxy}}
    spec:
      serviceAccountName: goalbox-proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: proxy
          image: "${C1_IMAGE}"
          imagePullPolicy: IfNotPresent
          command: [python3, /goalbox/sandbox/lib/netproxy.py, /var/run/goalbox, --tcp, "3128"]
          ports: [{containerPort: 3128}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts:
            - {name: proxy-src, mountPath: /goalbox/sandbox, readOnly: true}
            - {name: run, mountPath: /var/run/goalbox}
      volumes:
        - name: proxy-src
          configMap:
            name: goalbox-proxy-src
            items: [{key: netproxy.py, path: lib/netproxy.py}, {key: blocked-packages.txt, path: blocked-packages.txt}]
        - name: run
          emptyDir: {}
